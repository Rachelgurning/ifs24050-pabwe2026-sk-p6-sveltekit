<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Delcom Courses: platform belajar untuk membuat kursus, mengikuti materi video, dan memberi rating."
    />
    <meta name="theme-color" content="#4338ca" />
    <title>Delcom Courses</title>
    <style>
      #boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;background:#f8fafc;color:#475569;font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      #boot i{width:28px;height:28px;border-radius:50%;border:3px solid #c7d2fe;border-top-color:#4338ca;animation:boot-spin .8s linear infinite}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
    </style>
    %sveltekit.head%
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen">
    <div id="boot" role="status" aria-live="polite"><i aria-hidden="true"></i><span>Memuat Delcom Courses…</span></div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
